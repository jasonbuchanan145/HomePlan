name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  api-and-helm:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_DB: homeplan_test
          POSTGRES_USER: homeplan
          POSTGRES_PASSWORD: homeplan-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homeplan -d homeplan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HOMEPLAN_TEST_DATABASE_URL: postgres://homeplan:homeplan-test-password@localhost:5432/homeplan_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: api/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Go tests
        working-directory: api
        run: go test ./...

      - name: Helm lint
        run: helm lint deploy/helm/homeplan

      - name: Helm lint local values
        run: helm lint deploy/helm/homeplan -f deploy/helm/homeplan/values-local.yaml

      - name: Helm lint Rackspace values
        run: helm lint deploy/helm/homeplan -f deploy/helm/homeplan/values-rackspace.yaml

      - name: Helm template
        run: helm template homeplan deploy/helm/homeplan >/dev/null

      - name: Helm template local values
        run: helm template homeplan deploy/helm/homeplan -f deploy/helm/homeplan/values-local.yaml >/dev/null

      - name: Helm template Rackspace values
        run: helm template homeplan deploy/helm/homeplan -f deploy/helm/homeplan/values-rackspace.yaml >/dev/null

      - name: PowerShell script parse checks
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw scripts/run-minikube.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/seed-dev-house.ps1)) | Out-Null

  deploy-rackspace:
    runs-on: ubuntu-latest
    needs: api-and-helm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    env:
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/homeplan-web:${{ github.sha }}
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/homeplan-api:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push web image
        id: build-web
        uses: redhat-actions/buildah-build@v2
        with:
          image: homeplan-web
          tags: ${{ github.sha }}
          context: .
          containerfiles: ./web/Containerfile

      - name: Build and push API image
        id: build-api
        uses: redhat-actions/buildah-build@v2
        with:
          image: homeplan-api
          tags: ${{ github.sha }}
          context: .
          containerfiles: ./api/Containerfile

      - name: Push web image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-web.outputs.image }}
          tags: ${{ steps.build-web.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-api.outputs.image }}
          tags: ${{ steps.build-api.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.RACKSPACE_KUBECONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy HomePlan to Rackspace
        run: |
          helm upgrade --install homeplan ./deploy/helm/homeplan \
            --namespace homeplan \
            --create-namespace \
            -f ./deploy/helm/homeplan/values-rackspace.yaml \
            --set images.web="$WEB_IMAGE" \
            --set images.api="$API_IMAGE" \
            --set postgres.password="${{ secrets.HOMEPLAN_POSTGRES_PASSWORD }}" \
            --wait \
            --timeout 10m
