apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeplan-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: homeplan-api
  template:
    metadata:
      labels:
        app: homeplan-api
      annotations:
        homeplan.dev/rollout-token: {{ .Values.rolloutToken | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ .Values.images.api }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SESSION_COOKIE_NAME
              value: {{ .Values.api.sessionCookieName | quote }}
            - name: HOMEPLAN_DEV_MODE
              value: {{ .Values.api.devMode | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: homeplan-postgres
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: homeplan-api
spec:
  selector:
    app: homeplan-api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 8080
