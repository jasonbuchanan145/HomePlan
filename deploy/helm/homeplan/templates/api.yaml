apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeplan-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: homeplan-api
  template:
    metadata:
      labels:
        app: homeplan-api
    spec:
      containers:
        - name: api
          image: {{ .Values.images.api }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SESSION_COOKIE_NAME
              value: {{ .Values.api.sessionCookieName | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: homeplan-postgres
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: homeplan-api
spec:
  selector:
    app: homeplan-api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 8080
