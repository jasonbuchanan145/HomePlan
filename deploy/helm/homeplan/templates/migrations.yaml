apiVersion: v1
kind: ConfigMap
metadata:
  name: homeplan-migrations
data:
  001_initial_schema.sql: |
{{ .Files.Get "files/001_initial_schema.sql" | indent 4 }}
  002_shared_identity.sql: |
{{ .Files.Get "files/002_shared_identity.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: homeplan-migrate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ .Values.images.postgres }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: homeplan-postgres
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              until pg_isready -h homeplan-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
              for migration in /migrations/*.sql; do psql -h homeplan-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f "$migration"; done
          envFrom:
            - secretRef:
                name: homeplan-postgres
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: homeplan-migrations
