apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeplan-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeplan-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeplan-postgres
  template:
    metadata:
      labels:
        app: homeplan-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: homeplan-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homeplan-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: homeplan-postgres
spec:
  selector:
    app: homeplan-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
