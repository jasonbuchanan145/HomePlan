apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeplan-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: homeplan-web
  template:
    metadata:
      labels:
        app: homeplan-web
    spec:
      containers:
        - name: web
          image: {{ .Values.images.web }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: homeplan-web
spec:
  type: ClusterIP
  selector:
    app: homeplan-web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: 80
