images:
  web: localhost/homeplan-web:dev
  api: localhost/homeplan-api:dev
  postgres: docker.io/library/postgres:16-alpine

rolloutToken: local

api:
  devMode: true

postgres:
  database: homeplan
  user: homeplan
  password: homeplan-dev-password
  storage: 1Gi

ingress:
  enabled: false
  className: ""
  host: homeplan.local
  annotations: {}
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""
