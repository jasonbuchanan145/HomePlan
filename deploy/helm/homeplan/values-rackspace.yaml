images:
  web: ghcr.io/jasonbuchanan145/homeplan-web:latest
  api: ghcr.io/jasonbuchanan145/homeplan-api:latest
  postgres: docker.io/library/postgres:16-alpine

imagePullSecrets:
  - name: ghcr-pull-secret

rolloutToken: rackspace

api:
  devMode: false
  authBaseUrl: https://homeplan.cyclonedev.com

postgres:
  database: homeplan
  user: homeplan
  password: change-me-before-deploy
  storage: 10Gi

ingress:
  enabled: true
  className: nginx
  host: homeplan.cyclonedev.com
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /api/docs {
        return 404;
      }
      location = /api/openapi.json {
        return 404;
      }
      location = /api/openapi.yaml {
        return 404;
      }
      location = /api/openapi-3.0.json {
        return 404;
      }
      location = /api/openapi-3.0.yaml {
        return 404;
      }
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: cyclonedev-origin-tls
