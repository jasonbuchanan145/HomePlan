images:
  web: localhost/homeplan-web:dev
  api: localhost/homeplan-api:dev
  postgres: docker.io/library/postgres:16-alpine

imagePullSecrets: []

rolloutToken: dev

web:
  replicas: 1
  service:
    port: 80

api:
  replicas: 1
  service:
    port: 8080
  sessionCookieName: homeplan_session
  authSessionCookieName: homeplan_auth
  authBaseUrl: http://localhost:8080
  googleClientId: ""
  googleClientSecret: ""
  devMode: true

postgres:
  database: homeplan
  user: homeplan
  password: homeplan-dev-password
  storage: 1Gi

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""
